language: python

dist: jammy

python:
  - "3.12"

install:
  - pip install -r requirements.txt

script:
  - python manage.py check
  - black --check .
  - flake8 .
  - coverage run --rcfile=.coveragerc manage.py test
  - coverage report --rcfile=.coveragerc -m

after_success:
  - coveralls

before_deploy:
  - test -n "$AWS_ACCESS_KEY_ID"
  - test -n "$AWS_SECRET_ACCESS_KEY"
  - pip install awscli
  - export AWS_DEFAULT_REGION=us-east-1
  - export EB_VERSION_LABEL="travis-${TRAVIS_COMMIT}-${TRAVIS_BUILD_ID}"
  - git archive --format=zip --output=/tmp/swe1-app.zip HEAD

deploy:
  provider: script
  script: bash scripts/deploy-eb.sh
  skip_cleanup: true
  on:
    repo: MuskanKS/swe1-app
    branch: main
