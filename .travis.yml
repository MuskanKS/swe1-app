language: python

dist: jammy

python:
  - "3.12"

install:
  - pip install -r requirements.txt

script:
  - python manage.py check
  - black --check .
  - flake8 .
  - coverage run --rcfile=.coveragerc manage.py test
  - coverage report --rcfile=.coveragerc -m

  # Deploy only from the main branch, never from pull requests.
  - |
    if [[ "$TRAVIS_BRANCH" == "main" && "$TRAVIS_PULL_REQUEST" == "false" ]]; then
      echo "Starting AWS Elastic Beanstalk deployment..."

      test -n "$AWS_ACCESS_KEY_ID"
      test -n "$AWS_SECRET_ACCESS_KEY"

      pip install awscli

      export AWS_DEFAULT_REGION=us-east-1
      export EB_VERSION_LABEL="travis-${TRAVIS_COMMIT:0:12}-${TRAVIS_JOB_ID}-$(date +%s)"

      git archive --format=zip --output=/tmp/swe1-app.zip HEAD

      bash scripts/deploy-eb.sh
    else
      echo "Skipping AWS deployment for non-main or pull request build."
    fi

after_success:
  - coveralls
